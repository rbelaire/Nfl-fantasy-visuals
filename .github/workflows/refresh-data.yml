name: Refresh player data

# Pulls the latest weekly stats and commits them when they change.
# The commit triggers a new Vercel deployment.
on:
  schedule:
    - cron: "0 11 * * *" # daily, early morning US time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-data.mjs
      - name: Commit if the data changed
        run: |
          if [ -n "$(git status --porcelain public/data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data
            git commit -m "Refresh player data"
            git push
          fi
